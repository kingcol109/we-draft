<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Must be the very first thing in <head> — Prerender.io's headless
         browser can check this before your CSS/JS bundle even downloads.
         If the variable is undefined at that point (rather than the literal
         boolean false), Prerender.io falls back to default timing and may
         snapshot the page before your data has loaded, regardless of
         whatever React later sets it to. This has to exist synchronously,
         before React mounts — a useEffect inside the app runs too late. -->
    <script>window.prerenderReady = false;</script>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/wd-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0055a5" />
    <!-- Warms up the connection (DNS + TLS handshake) to the two hosts every
         page's very first render depends on — Firestore for basically all
         content, i.mgur.com for most team/player logos — before the app's
         own JS has even parsed enough to issue those requests. Matters more
         on mobile, where that handshake round-trip costs more to begin
         with. crossorigin is required on preconnect even for same-origin-
         looking hints when the actual requests will be CORS (fetch/XHR),
         or the browser opens a second, wasted connection for the real one. -->
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://i.imgur.com" crossorigin />
    <link rel="dns-prefetch" href="https://firestore.googleapis.com" />
    <link rel="dns-prefetch" href="https://i.imgur.com" />
    <!-- No static <meta name="description"> here on purpose — every page
         sets its own via <Helmet>, and a fallback default lives in App.js's
         root Helmet. A static tag here would sit alongside (not replace)
         each page's Helmet-managed one, since Helmet can only dedupe tags
         it's tracking — the fallback in App.js is, so nested page Helmets
         correctly override it, which a raw static tag in this file can't be. -->
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/sec.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>We-Draft.com — Community NFL Draft Scouting</title>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-W806MFEXSX"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-W806MFEXSX');
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
