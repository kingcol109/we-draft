name: Sync CFBD Player Stats

# Runs weekly, Sunday at 10:00 UTC (6am EDT / 5am EST — GitHub Actions
# schedules always run in UTC, see sync-analytics.yml's own comment), after
# Saturday's games have all finished. Two steps, ~10 CFBD calls a week:
#   - scripts/syncCfbdPlayerStats.js — 2026 season totals on every CFBD
#     player linked to a We-Draft profile (the player page's "2026 Stats"
#     card). 1 call. Game logs are written by the live ingester as games
#     end, so this only needs the totals.
#   - scripts/syncCfbdRosters.js — full team rosters, recruiting stars and
#     season stats for the CFB team page's Roster and Stats tabs. 9 calls.
# Idempotent; also runnable on demand via workflow_dispatch (e.g. after a
# weekday game).
#
# Needs repo secrets GOOGLE_SERVICE_ACCOUNT_KEY (already used by the other
# workflows) and CFBD_API_KEY.
on:
  schedule:
    - cron: "0 10 * * 0"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Sync season player stats
        run: node scripts/syncCfbdPlayerStats.js
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}

      # Full team rosters for the CFB team page's Roster tab — one CFBD call
      # for every team (see scripts/syncCfbdRosters.js).
      - name: Sync team rosters
        run: node scripts/syncCfbdRosters.js
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
