name: Build Draft Sim Games

# Weekly, Sunday at 11:00 UTC — an hour after sync-cfbd-player-stats.yml,
# once Saturday's game logs are all in. Rebuilds compSnapshots/simGames:
# every Draft Sim prospect's standout game this season for Isaac Walker's
# big-game takes (scripts/buildSimGamesSnapshot.mjs), so the sim reads one
# doc a session instead of ~20 per pick. ~5–10k reads a run. Also runnable
# on demand via workflow_dispatch.
#
# Needs repo secret GOOGLE_SERVICE_ACCOUNT_KEY.
on:
  schedule:
    - cron: "0 11 * * 0"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      # Node 22: the script imports the app's own ESM (bestGame.js) directly.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build Draft Sim games snapshot
        run: node scripts/buildSimGamesSnapshot.mjs
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
