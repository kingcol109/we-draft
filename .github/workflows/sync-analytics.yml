name: Sync Google Analytics

# Runs daily at 6am UTC (2am ET / 11pm PT the prior day, adjust the cron
# expression below if you want a different local time — GitHub Actions
# schedules always run in UTC). Also runnable on-demand from GitHub's
# Actions tab via workflow_dispatch, useful for testing this workflow
# itself without waiting for the schedule or touching your own terminal.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run analytics sync
        run: node scripts/syncGoogleAnalytics.js
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          GA_PROPERTY_ID: ${{ secrets.GA_PROPERTY_ID }}